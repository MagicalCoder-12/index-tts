name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.1)'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      - name: Check if release exists
        id: check_release
        run: |
          RELEASE=$(gh release view "${{ steps.tag.outputs.tag }}" 2>/dev/null || echo "")
          if [ -z "$RELEASE" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: IndexTTS2 Release ${{ steps.tag.outputs.tag }}
          body: |
            # IndexTTS2 ${{ steps.tag.outputs.tag }}

            ## Installation

            See [INSTALL.md](INSTALL.md) for detailed installation instructions.

            Quick start:
            ```bash
            git clone https://github.com/index-tts/index-tts.git
            cd index-tts
            git lfs pull
            pip install -U uv
            uv sync --all-extras
            ```

            ## What's New

            For detailed changes and features, see [RELEASE_NOTES.md](RELEASE_NOTES.md)

            ## Resources

            - **Documentation**: See [README.md](README.md)
            - **Paper**: [https://arxiv.org/abs/2506.21619](https://arxiv.org/abs/2506.21619)
            - **Model Hub**: [IndexTeam/IndexTTS-2 on Hugging Face](https://huggingface.co/IndexTeam/IndexTTS-2)
            - **Demo**: [https://index-tts.github.io/index-tts2.github.io/](https://index-tts.github.io/index-tts2.github.io/)

            ## Support

            - **Discord**: [https://discord.gg/uT32E7KDmy](https://discord.gg/uT32E7KDmy)
            - **GitHub Issues**: [Report bugs](https://github.com/index-tts/index-tts/issues)
            - **Email**: indexspeech@bilibili.com

            ## System Requirements

            - Python 3.10+
            - Git LFS
            - NVIDIA CUDA 12.8+ (for GPU acceleration)
            - 8GB+ RAM, 10GB+ disk space

          draft: false
          prerelease: false

      - name: Update release (if exists)
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Release ${{ steps.tag.outputs.tag }} already exists. No update needed."

  build-source-dist:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build distribution
        run: |
          python -m build

      - name: Upload source distribution
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          tag_name: ${{ steps.tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
